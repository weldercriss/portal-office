name: Build e deploy no EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-backoffice-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DOCKER_NAMESPACE: ${{ vars.DOCKER_NAMESPACE }}
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
      EC2_DIR: ${{ vars.EC2_DIR }}
      PLATFORM: ${{ vars.PLATFORM || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verificar configuracao
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          for name in DOCKER_NAMESPACE EC2_HOST DOCKERHUB_USERNAME DOCKERHUB_TOKEN EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name em Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          source scripts/lib/image-tag.sh
          validate_namespace
          for file in scripts/*.sh scripts/lib/*.sh backend/docker-entrypoint.sh; do bash -n "$file"; done
          bash scripts/tests/remote-deploy.sh

      - name: Identificar imagens
        id: images
        run: |
          source scripts/lib/image-tag.sh
          require_clean_tree
          echo "tag=$(image_tag)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - name: Validar Compose e Caddy
        env:
          IMAGE_TAG: ${{ steps.images.outputs.tag }}
        run: |
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet
          docker compose --env-file .env.production.example -f docker-compose.caddy.yml config --quiet
          docker run --rm -v "$PWD/frontend/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -e APP_DOMAIN=:80 -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ env.DOCKER_NAMESPACE }}/portal-backoffice-backend:${{ steps.images.outputs.tag }}
          cache-from: type=gha,scope=portal-backoffice-backend
          cache-to: type=gha,mode=max,scope=portal-backoffice-backend

      - name: Construir e publicar painel
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          tags: ${{ env.DOCKER_NAMESPACE }}/portal-backoffice-web:${{ steps.images.outputs.tag }}
          cache-from: type=gha,scope=portal-backoffice-web
          cache-to: type=gha,mode=max,scope=portal-backoffice-web

      - name: Entregar e verificar saude
        timeout-minutes: 10
        env:
          IMAGE_TAG: ${{ steps.images.outputs.tag }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo 'Deploy ignorado: main ja possui um commit mais recente.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/portal-backoffice-ssh.XXXXXX")"
          export SSH_KEY="$ssh_dir/key" SSH_KNOWN_HOSTS="$ssh_dir/known_hosts"
          trap 'rm -f -- "$SSH_KEY" "$SSH_KNOWN_HOSTS"; rmdir -- "$ssh_dir"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$SSH_KEY"
          printf '%s\n' "$EC2_KNOWN_HOSTS" | tr -d '\r' > "$SSH_KNOWN_HOSTS"
          unset EC2_SSH_KEY EC2_KNOWN_HOSTS GH_TOKEN
          bash scripts/deploy.sh "$IMAGE_TAG"
          echo "Deploy concluido: $IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
